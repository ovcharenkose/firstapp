<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#A8B890">
  <title>Focus</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="med-page">

  <header class="cal-header">
    <a href="../index.html" class="cal-back" aria-label="Back">‹</a>
    <div class="cal-actions"></div>
  </header>

  <!-- ЭТАП 1: Настройки -->
  <main class="med-setup" id="fixSetup">
    <div class="med-content-box">
      <h1 class="cal-title" style="margin-bottom: 20px;">Focus</h1>
      
      <div class="fix-form">
        <p class="med-question">Выбери часы занятий</p>
        
        <label class="fix-label">Количество уроков:</label>
        <input type="number" id="fixLessons" class="fix-input" value="3" min="1">

        <label class="fix-label">Перерыв (минут):</label>
        <input type="number" id="fixBreak" class="fix-input" value="10" min="1">

        <label class="fix-label">Доп. перерыв (минут):</label>
        <input type="number" id="fixExtraBreakTime" class="fix-input" value="" placeholder="Необязательно" min="1">

        <label class="fix-label">После какого урока сделать доп. перерыв?</label>
        <input type="number" id="fixExtraBreakAfter" class="fix-input" value="" placeholder="Необязательно" min="1">

        <button class="btn btn-primary" id="fixNextBtn" style="margin-top: 15px;">Далее</button>
      </div>
    </div>
  </main>

  <!-- ЭТАП 2: Выбор музыки -->
  <main class="med-setup" id="musicSetup" style="display:none;">
    <div class="med-content-box">
      <h1 class="cal-title" style="margin-bottom: 20px;">Fixation</h1>
      
      <div class="fix-form">
        <p class="med-question">Выбери тип музыки</p>
        <button class="btn btn-primary med-opt fix-music-btn" data-music="Lo-Fi">Lo-Fi</button>
        <button class="btn btn-primary med-opt fix-music-btn" data-music="Rain">Дождь</button>
        <button class="btn btn-primary med-opt fix-music-btn" data-music="birds">Пение птиц</button>
        <button class="btn btn-primary med-opt fix-music-btn" data-music="fireplace">Камин</button>
      </div>
    </div>
  </main>

  <!-- ЭТАП 3: Отсчёт 10 секунд -->
  <main class="med-setup" id="countdownSetup" style="display:none;">
    <div class="countdown-number" id="countdownNumber">10</div>
  </main>

  <!-- ЭТАП 4: Экран урока/перерыва -->
  <main class="med-player" id="fixPlayer" style="display:none;">
    <div class="med-avatar-wrap">
      <img src="../images/meditation.webp" alt="Fixation" class="med-avatar">
    </div>

    <div class="med-glass-panel" style="padding-top: 20px; padding-bottom: 80px;">
      <canvas id="fixCanvas" class="med-canvas-bg"></canvas>
      
      <p class="fix-status" id="fixStatus">Урок 1/3</p>
      <div class="fix-time-box">
        <span id="fixTimer">60:00</span>
      </div>
      <p class="fix-music-name" id="fixMusicName">Rain</p>
      
      <div class="med-progress-wrap" style="margin-top: 10px;">
        <div class="med-progress-bar" id="fixProgress" style="width: 0%;"></div>
      </div>
    </div>

    <audio id="fixAudio" src="" loop></audio>
  </main>

  <!-- ЭТАП 5: Финал -->
  <main class="med-setup" id="finishSetup" style="display:none;">
    <div class="finish-box">
      <p class="med-question" style="font-size: 28px;">Так держать, ты добился цели!</p>
      <a href="../index.html" class="btn btn-primary" style="margin-top: 20px;">Назад в меню</a>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
